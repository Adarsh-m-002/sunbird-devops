
---
- name: Check Python 3.11 installation
  raw: test -x /usr/bin/python3.11
  register: python311_check
  changed_when: false
  failed_when: false

- name: Install Python 3.11 prerequisites
  raw: |
    apt-get update
    apt-get install -y software-properties-common
    add-apt-repository -y ppa:deadsnakes/ppa
    apt-get update
    apt-get install -y python3.11 python3.11-venv
  when: python311_check.rc != 0

- name: Check Python virtual environment
  raw: test -x /opt/ansible-python311/bin/python
  register: venv_check
  changed_when: false
  failed_when: false

- name: Create Python 3.11 virtual environment
  raw: python3.11 -m venv /opt/ansible-python311
  when: venv_check.rc != 0

- name: Install Ansible Python dependencies
  raw: |
    /opt/ansible-python311/bin/pip install \
      cffi cryptography pyOpenSSL "urllib3<2"
  register: python_dependencies
  changed_when: "'Successfully installed' in python_dependencies.stdout"
