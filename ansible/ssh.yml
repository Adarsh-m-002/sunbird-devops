
---
- name: Add SSH user
  hosts: "bastion:{{ remote }}"
  become: yes
  roles:
    - add_user
  tags:
    - add-user

- name: Delete SSH user
  hosts: "bastion:{{ remote }}"
  become: yes
  tasks:
    - name: Remove user and home directory
      user:
        name: "{{ ssh_user }}"
        state: absent
        remove: yes
      tags:
        - delete-user

    - name: Remove user group
      group:
        name: "{{ ssh_user }}"
        state: absent
      tags:
        - delete-user
  tags:
    - delete-user
